name: BTC 均线监控

on:
  schedule:
    # 每 30 分钟检查一次。刻意避开 :00 和 :30——GitHub 官方说明整点前后是
    # Actions 拥堵高峰，定时任务会被大幅延迟甚至跳过，故改用 :09 和 :39。
    # 即便仍有延迟也不会漏报：判断"抵达"看的是整根K线的最高/最低价，
    # 两次运行之间发生的触碰照样能捕获。
    - cron: '9,39 * * * *'
  workflow_dispatch:        # 支持在 Actions 页面手动点击运行
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: check
        type: choice
        options:
          - check         # 正常检查均线，触发条件满足才推送
          - test-notify   # 立刻发一条测试消息，验证推送通道（不影响提醒状态）

# 允许把 state.json 提交回仓库，用于跨次运行记住"哪条均线已经提醒过"
permissions:
  contents: write

# 同一时间只跑一个，避免两次运行同时改 state.json 造成冲突
concurrency:
  group: btc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: 执行检查
        # 定时触发时 inputs.mode 为空，回落到 check
        env:
          BTC_MONITOR_CONFIG: config.ci.json
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 btc_monitor.py "${{ inputs.mode || 'check' }}"

      - name: 保存提醒状态
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "状态无变化，无需提交"
            exit 0
          fi
          git config user.name  "btc-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state.json 是"最后写入者胜出"的文件，与远程做合并/变基只会冲突
          # （重跑旧运行、或运行期间有人推送时必然发生）。
          # 正确做法是把刚算出的内容直接叠加到远程最新提交之上。
          cp state.json "$RUNNER_TEMP/state.new.json"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/state.new.json" state.json
            if [ -z "$(git status --porcelain state.json)" ]; then
              echo "远程状态已是最新，无需提交"; exit 0
            fi
            git add state.json
            git commit -q -m "chore: 更新均线监控状态 [skip ci]"
            # 用 HEAD:main，即使处于分离头指针（重跑时）也能正确推送
            git push -q origin HEAD:main && exit 0
            echo "第 $i 次推送被拒（远程有新提交），重新叠加后重试"
            sleep 3
          done
          echo "::warning::state.json 推送失败，下次运行会重新计算状态"
